# בונה את app/ אחרי כל דחיפה ל-main, לקישור raw.githack שמציג את המיזוג האחרון בלי Vercel.
name: build-app
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:github
      - name: Commit app/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then echo "app/ unchanged"; exit 0; fi
          git commit -m "Build app/ for raw.githack"
          git push
